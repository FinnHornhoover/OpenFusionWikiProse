name: Release player prose

on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: prose-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PROSE_REPOSITORY: ${{ github.repository }}
      SITE_URL: ${{ vars.FFWIKI_BASE_URL || 'https://fusionfall.wiki' }}
    steps:
      - name: Check out prose history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the release snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          git fetch origin main dev --tags
          git checkout --detach origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base=$(git rev-parse HEAD)
          commit=''
          tag=''
          resume=false
          errors="$RUNNER_TEMP/prose-release-lookup.log"

          # Resume the latest tagged publication even if main has since moved.
          while IFS= read -r candidate; do
            [[ -n "$candidate" ]] || continue
            if existing=$(gh release view "$candidate" --repo "$PROSE_REPOSITORY" --json isDraft,assets 2>"$errors"); then
              if [[ $(jq -r '.isDraft' <<< "$existing") == true ]]; then
                tag="$candidate"
              elif ! jq -e --arg archive "openfusion-wiki-$candidate.zip" 'any(.assets[]; .name == $archive and .state == "uploaded")' <<< "$existing" > /dev/null; then
                echo "::error::Published release $candidate has no completed prose ZIP."
                exit 1
              fi
            elif grep -qi 'release not found' "$errors"; then
              tag="$candidate"
            else
              cat "$errors" >&2
              exit 1
            fi
            if [[ -n "$tag" ]]; then
              commit=$(git rev-parse "$tag^{commit}")
              resume=true
            fi
            break
          done < <(git tag --merged "$base" --list 'prose-????-??-??' 'prose-????-??-??-[0-9]*' --sort=-version:refname)

          if [[ "$resume" == false ]]; then
            if git merge-base --is-ancestor origin/dev HEAD ||
              git diff --quiet HEAD origin/dev -- pages image-attribution.json LICENSE; then
              echo 'No new prose changes to release.'
              exit 0
            fi
            git merge --no-edit origin/dev
            if git diff --quiet "$base" HEAD -- pages image-attribution.json LICENSE; then
              echo 'The merge produced no new prose changes.'
              exit 0
            fi
            commit=$(git rev-parse HEAD)
            day=$(date -u +%F)
            tag="prose-$day"
            number=1
            while git show-ref --verify --quiet "refs/tags/$tag"; do
              number=$((number + 1))
              tag="prose-$day-$number"
            done
          fi

          count=$(git ls-tree -r --name-only "$commit" -- pages |
            awk '/^pages\/[a-zA-Z0-9_-]+\/(general|specific)\/[a-zA-Z0-9_-]+\.json$/ { n++ } END { print n+0 }')
          if [[ "$count" == 0 ]]; then
            echo 'The snapshot has no documents to release.'
            exit 0
          fi
          {
            echo "base=$base"
            echo "commit=$commit"
            echo "tag=$tag"
            echo "archive=openfusion-wiki-$tag.zip"
            echo "resume=$resume"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.snapshot.outputs.commit != ''
        with:
          node-version: '22'
          cache: npm

      - name: Install ZIP exporter dependencies
        if: steps.snapshot.outputs.commit != ''
        run: npm ci --ignore-scripts

      - name: Package the prose ZIP
        if: steps.snapshot.outputs.commit != ''
        env:
          COMMIT: ${{ steps.snapshot.outputs.commit }}
          ARCHIVE: ${{ steps.snapshot.outputs.archive }}
        run: |
          npm run export:prose -- \
            --ref "$COMMIT" \
            --repository "$PROSE_REPOSITORY" --site-url "$SITE_URL" \
            --output "$RUNNER_TEMP/$ARCHIVE"
          unzip -tq "$RUNNER_TEMP/$ARCHIVE"

      - name: Promote the packaged snapshot
        if: steps.snapshot.outputs.commit != '' && steps.snapshot.outputs.resume != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.snapshot.outputs.commit }}
          TAG: ${{ steps.snapshot.outputs.tag }}
        run: |
          git tag "$TAG" "$COMMIT"
          git push --atomic origin "$COMMIT:refs/heads/main" "refs/tags/$TAG"

      - name: Publish the GitHub release
        if: steps.snapshot.outputs.commit != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.snapshot.outputs.commit }}
          TAG: ${{ steps.snapshot.outputs.tag }}
          ARCHIVE: ${{ steps.snapshot.outputs.archive }}
        run: |
          tagged_commit=$(gh api "repos/$PROSE_REPOSITORY/commits/$TAG" --jq '.sha')
          if [[ "$tagged_commit" != "$COMMIT" ]]; then
            echo "::error::Tag $TAG points to a different revision."
            exit 1
          fi
          day=${TAG#prose-}
          title="Wiki prose ${day:0:10}"
          if [[ ${#day} -gt 10 ]]; then
            title="$title (${day:11})"
          fi
          errors="$RUNNER_TEMP/prose-release-lookup.log"
          if existing=$(gh release view "$TAG" --repo "$PROSE_REPOSITORY" --json isDraft,assets 2>"$errors"); then
            if [[ $(jq -r '.isDraft' <<< "$existing") == false ]]; then
              if ! jq -e --arg archive "$ARCHIVE" 'any(.assets[]; .name == $archive and .state == "uploaded")' <<< "$existing" > /dev/null; then
                echo "::error::Published release $TAG has no completed prose ZIP."
                exit 1
              fi
              echo "Release $TAG already contains the ZIP."
              exit 0
            fi
          elif grep -qi 'release not found' "$errors"; then
            gh release create "$TAG" --repo "$PROSE_REPOSITORY" --verify-tag --draft \
              --title "$title" \
              --notes "Prose snapshot $COMMIT. Download $ARCHIVE for the documents, contributor credits, and referenced images."
          else
            cat "$errors" >&2
            exit 1
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/$ARCHIVE" --repo "$PROSE_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$PROSE_REPOSITORY" --title "$title" --draft=false
